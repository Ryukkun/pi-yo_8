[project]
name = "pi-yo-8"
version = "0.1.0"
description = "Discord music bot"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "discord-py[voice]>=2.4.0",
    "numpy>=2.0.0",
    "tabulate>=0.9.0",
    "yt-dlp[default]>=2026.2.21",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
    "pyright>=1.1.380",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
